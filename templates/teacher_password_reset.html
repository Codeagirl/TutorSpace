<!DOCTYPE html>
<html>
<head>
    <title>Password Reset</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='static.css') }}">
</head>
<body>
    <main class="container">
        <h1>Password Reset</h1>
        <p>Temporary password for <strong>{{ label }}</strong>:</p>
        <h2 style="font-family: monospace; text-align:center;">{{ temp }}</h2>
        <article>
            <p><strong>This is the only time it will be shown.</strong> Give it to the student in person.</p>
            <p>They will be asked to choose their own password as soon as they log in, and any device they were
               logged in on has been logged out.</p>
        </article>
        <a href="/teacher/students" role="button">Back to Students</a>
    </main>
</body>
</html>
