<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='static.css') }}">
</head>
<body>
    <main class="container">
        <h1>Change Password</h1>
        {% if forced %}
            <p>A teacher reset your password. Please choose your own new password to continue.</p>
        {% endif %}
        {% if error %}<p style="color:red;">{{ error }}</p>{% endif %}

        <form method="POST" action="/change_password">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="current_password">{{ 'Temporary password' if forced else 'Current password' }}</label>
            <input type="password" name="current_password" id="current_password" required>

            <label for="new_password">New password</label>
            <input type="password" name="new_password" id="new_password" required>
            <small>At least 6 characters, with 1 uppercase letter and 1 number.</small>

            <label for="confirm_password">Confirm new password</label>
            <input type="password" name="confirm_password" id="confirm_password" required>

            <button type="submit">Change Password</button>
            {% if not forced %}<a href="/dashboard" role="button" class="secondary">Cancel</a>{% endif %}
        </form>
    </main>
</body>
</html>
